name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
permissions:
  # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Github sha
        id: github_sha
        run: echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "15.14.0"
          cache: "npm"

      - name: Install dependencies
        id: install_dependencies
        run: npm install

      - name: Run Linter
        id: run_linter
        run: npm run lint

      - name: Run Prettier
        id: run_prettier
        uses: actionsx/prettier@v2
        with:
          args: --write .
      - name: Commit changes from prettier
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Format code with Prettier"
          branch: ${{ github.head_ref }}
          push_options: "--force"

      - name: Run tests
        id: run_tests
        run: CI=true npm run test

      - name: Run Build
        id: run_build
        run: npm run build

      - name: Login to Docker Hub
        id: docker_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        id: setup_qemu
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          platform: linux/amd64, linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rdicidr:latest
            
      - name: Validate steps
        if: always()
        run: |
          echo "==== Pipeline Result ===="
          echo "Install Dependencies: ${{ steps.install_dependencies.outcome }}"
          echo "Run Linter: ${{ steps.run_linter.outcome }}"
          echo "Run Prettier: ${{ steps.run_prettier.outcome }}"
          echo "Run Tests: ${{ steps.run_tests.outcome }}"
          echo "Run Build: ${{ steps.run_build.outcome }}"
          echo "Run Docker Build: ${{ steps.build_and_push.outcome }}"
          echo "=========================="
          if [[ "${{ steps.install_dependencies.outcome }}" == "failure" ]] || \
             [[ "${{ steps.run_linter.outcome }}" == "failure" ]] || \
             [[ "${{ steps.run_tests.outcome }}" == "failure" ]] || \
             [[ "${{ steps.run_build.outcome }}" == "failure" ]] || \
             [[ "${{ steps.build_and_push.outcome }}" == "failure" ]]; then
            echo "Pipeline failed."
            exit 1
          else
            echo "Pipeline succeeded."
          fi
