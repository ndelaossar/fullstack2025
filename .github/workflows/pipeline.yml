name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Github sha
        id: github_sha
        run: echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '15.14.0'
          cache: 'npm'

      - name: Install dependencies
        id: install_dependencies
        run: npm install

      - name: Run Linter
        id: run_linter
        run: npm run lint

      - name: Run Prettier
        id: run_prettier
        run: npm run prettier

      - name: Run tests
        id: run_tests
        run: CI=true npm run test

      - name: Run Build
        id: run_build
        run: npm run build

      - name: Login to Docker Hub
        id: docker_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        id: setup_qemu
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fl_rdicidr:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fl_rdicidr:${{ steps.github_sha.outputs.sha }}
      
      - name: Validate steps
        if: always()
        run: |
          echo "==== Pipeline Result ===="
          echo "Install Dependencies: ${{ steps.install_dependencies.outcome }}"
          echo "Run Linter: ${{ steps.run_linter.outcome }}"
          echo "Run Prettier: ${{ steps.run_prettier.outcome }}"
          echo "Run Tests: ${{ steps.run_tests.outcome }}"
          echo "Run Build: ${{ steps.run_build.outcome }}"
          echo "Run Docker Build: ${{ steps.build_and_push.outcome }}"
          echo "=========================="
          if [[ "${{ steps.install_dependencies.outcome }}" == "failure" ]] || \
             [[ "${{ steps.run_linter.outcome }}" == "failure" ]] || \
             [[ "${{ steps.run_tests.outcome }}" == "failure" ]] || \
             [[ "${{ steps.run_build.outcome }}" == "failure" ]] || \
             [[ "${{ steps.build_and_push.outcome }}" == "failure" ]]; then
            echo "Pipeline failed."
            exit 1
          else
            echo "Pipeline succeeded."
          fi
